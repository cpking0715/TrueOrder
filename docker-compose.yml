# 本地/演示一键起：Postgres + API + worker
# 用法：复制 .env.example 为 .env 后 docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trueorder
      POSTGRES_PASSWORD: trueorder
      POSTGRES_DB: trueorder
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueorder"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trueorder_pg:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TRUEORDER_DATABASE_URL: postgresql+psycopg://trueorder:trueorder@db:5432/trueorder
      TRUEORDER_SAMPLE_MODE: "false"
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run python -m app.bootstrap &&
             uv run uvicorn app.interface.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file: .env
    environment:
      TRUEORDER_DATABASE_URL: postgresql+psycopg://trueorder:trueorder@db:5432/trueorder
      TRUEORDER_SAMPLE_MODE: "false"
    command: ["uv", "run", "python", "-m", "app.worker", "--interval", "2"]
    stop_grace_period: 60s

volumes:
  trueorder_pg:
