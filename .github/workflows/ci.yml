name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trueorder
          POSTGRES_PASSWORD: trueorder
          POSTGRES_DB: trueorder
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trueorder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run pytest -q -m smoke
      # 只给 alembic 步骤设 URL：job 级会覆盖 pytest 迁移用例里程序化设置的测试库 URL
      - run: uv run alembic upgrade head
        env:
          TRUEORDER_DATABASE_URL: postgresql+psycopg://trueorder:trueorder@localhost:5433/trueorder
      - run: uv run alembic check
        env:
          TRUEORDER_DATABASE_URL: postgresql+psycopg://trueorder:trueorder@localhost:5433/trueorder
      - run: uv run python -m app.export_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 必填变量缺失必须报错；补齐后配置可解析
      - run: cp .env.example .env
      - run: "! docker compose config -q 2>/dev/null"
      - run: POSTGRES_PASSWORD=ci-dummy TRUEORDER_API_TOKEN=ci-dummy docker compose config -q

  schema-consistency:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend/
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git diff --exit-code src/api/schema.d.ts
