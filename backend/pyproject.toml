[project]
name = "trueorder-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "cpking0715", email = "1396920681@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    # 爬虫 DNS 钉扎依赖 httpcore 私有后端；锁次要版本，升级需重跑 crawler SSRF 测试
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "mypy>=1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: e2e 冒烟，默认命令不跑，动主链路时手动 uv run pytest -q -m smoke",
]
addopts = "-m 'not smoke'"

[tool.ruff]
line-length = 100
target-version = "py313"
# 已发布迁移不做格式化改写（改历史迁移会让既有库与代码失配）
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的标准写法是 Depends(...) 作为参数默认值
"app/interface/**" = ["B008"]
# 内嵌 CSV fixture 的行宽由数据决定，不做代码折行
"tests/infra/test_importer.py" = ["E501"]
# 测试里 assert 是断言本身；测试令牌与造数随机数不涉及安全
"tests/**" = ["S101", "S105", "S106", "S311"]
"tests/infra/test_queries.py" = ["E501"]
"tests/interface/test_api.py" = ["E501"]


[tool.mypy]
python_version = "3.13"
mypy_path = "."
packages = ["app"]
# 先对 domain 开严格；其余层逐步收紧（见 PR 说明）
[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true


[[tool.mypy.overrides]]
module = ["app.infrastructure.*", "app.interface.*", "app.core.*", "app.bootstrap", "app.worker", "app.export_openapi"]
ignore_errors = true
